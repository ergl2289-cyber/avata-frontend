<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Avata — авто в Telegram</title>
    <meta name="description" content="Avata — доска объявлений по продаже авто прямо в Telegram." />
    <meta name="theme-color" content="#0F0F0F" />

    <!-- Иконки: вкладка браузера + домашний экран iOS («Добавить на экран Домой») -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Имя ярлыка на экране Домой (иначе iOS берёт длинный <title>) -->
    <meta name="apple-mobile-web-app-title" content="Avata" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Warm up connections to API & image CDN before the first request -->
    <link rel="preconnect" href="https://api.avata.site" crossorigin />
    <link rel="preconnect" href="https://d.avata.site" crossorigin />
    <link rel="dns-prefetch" href="https://api.avata.site" />
    <link rel="dns-prefetch" href="https://d.avata.site" />

    <!-- Open Graph (превью ссылки в чатах / соцсетях) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Avata" />
    <meta property="og:title" content="Avata — авто в Telegram" />
    <meta property="og:description" content="Доска объявлений по продаже авто прямо в Telegram." />
    <meta property="og:url" content="https://avata.site/" />
    <meta property="og:image" content="https://avata.site/og-avata.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Avata — авто в Telegram" />
    <meta name="twitter:description" content="Доска объявлений по продаже авто прямо в Telegram." />
    <meta name="twitter:image" content="https://avata.site/og-avata.jpg" />

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
